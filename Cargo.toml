[package]
name = "armature-graphql-macros"
version = "0.1.2"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-graphql-macros"
homepage = "https://quinnjr.github.io/armature"
description = "NestJS-style resolver decorator macros for Armature GraphQL"
keywords = ["proc-macro", "graphql", "resolver", "framework"]
categories = ["development-tools::procedural-macro-helpers", "web-programming"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
armature-graphql = { version = "0.6" }
async-graphql = "7.2.1"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros"] }
trybuild = "1"
